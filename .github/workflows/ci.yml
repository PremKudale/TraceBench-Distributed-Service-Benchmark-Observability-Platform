name: TraceBench CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # 1. Test Go Services & Run Memory Allocation Benchmarks
  go-test-and-bench:
    name: Go Ingestion & Benchmark Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download & Verify Go Modules
        run: |
          go mod download
          go mod verify

      - name: Run Go Unit Tests
        run: go test -v -race ./services/ingest-collector-go/...

      - name: Run Memory Allocation & Throughput Benchmarks
        run: |
          echo "Running buffer pool and parser benchmarks..."
          go test -bench="." -benchmem ./services/ingest-collector-go/bufferpool/...
          go test -bench="." -benchmem ./services/ingest-collector-go/parser/...

  # 2. Test Java 21 Order Processing Microservice
  java-test:
    name: Java Order Service Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test with Maven
        working-directory: ./services/order-service-java
        run: mvn clean test --batch-mode

  # 3. Docker Container Build Verification
  docker-build:
    name: Multi-stage Docker Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Ingest Collector Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/ingest-collector-go/Dockerfile
          push: false
          tags: tracebench/ingest-collector:latest

      - name: Build Gateway Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/gateway-service-go/Dockerfile
          push: false
          tags: tracebench/gateway-service:latest

  # 4. Kubernetes Manifest Validation
  k8s-validate:
    name: Kubernetes Manifests & Kustomize Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Kubernetes Manifests with Kustomize Dry-Run
        run: |
          kubectl kustomize k8s/base/
          kubectl apply --dry-run=client -k k8s/base/

